services:
  app:
    build:
      context: .
      args:
        SERVER_PORT: ${SERVER_PORT}
    tty: true
    stdin_open: true
    command: 'tail -f /dev/null'
    volumes:
      - ./:/usr/src/app
    # depends_on:
    #   - db
    working_dir: /usr/src/app
    environment:
      DBUSER: root
      DBPASS: zzz
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
